[project]
name = "flymj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yin.lo", email = "lo2003058@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jansou>=0.14.0",
    "mahjong>=2.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "streamlit>=1.64.0",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
]

[project.scripts]
flymj = "flymj:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
